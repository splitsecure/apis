syntax = "proto3";
package splitsecure.keys.v1;

import "splitsecure/keys/v1/diffie_hellman_spec.proto";
import "splitsecure/keys/v1/key_encapsulation_spec.proto";
import "splitsecure/keys/v1/signature_spec.proto";
import "splitsecure/keys/v1/symmetric_encryption_spec.proto";

message Spec {
  oneof union {
    SymmetricEncryptionSpec symmetric_encryption = 1;
    SignatureSpec signature = 2;
    DiffieHellmanSpec diffie_hellman = 3;
    KeyEncapsulationSpec key_encapsulation = 4;
  }
}
