syntax = "proto3";

package splitsecure.orgsvc.v1;

import "splitsecure/orgsvc/v1/member.proto";

message ListMembersRequest {
  Base base = 2;
  message Base {
    string organization_id = 1;
    int32 limit = 2;
    string cursor = 3;
  }
}

message ListMembersResponse {
  repeated Member members = 1;
  string next_cursor = 2;
}
