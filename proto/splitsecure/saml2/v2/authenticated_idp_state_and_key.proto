syntax = "proto3";
package splitsecure.saml2.v2;

import "splitsecure/teamresource/v1/team_signature.proto";

message AuthenticatedIdPStateAndKey {
  bytes authenticated = 1; // Serialized saml2.v2.IdPStateAndKey (fields 1-2 only)
  repeated splitsecure.teamresource.v1.TeamSignature team_signatures = 2;
}
