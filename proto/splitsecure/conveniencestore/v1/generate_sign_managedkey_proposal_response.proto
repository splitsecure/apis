syntax = "proto3";
package splitsecure.conveniencestore.v1;

import "splitsecure/enclave/v1/invoke_request.proto";

message GenerateSignManagedKeyProposalResponse {
  // invoke_request is the MintProposalRequest envelope the caller
  // hands to EnclaveRoundtripService.Send.  The InvokeResponse the
  // proposal eventually produces decodes as
  // managedsigning.v1.Response{Sign: SignResponse}.
  splitsecure.enclave.v1.InvokeRequest invoke_request = 1;
}
