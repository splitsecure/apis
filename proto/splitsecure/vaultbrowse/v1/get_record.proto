syntax = "proto3";
package splitsecure.vaultbrowse.v1;

import "google/protobuf/timestamp.proto";
import "splitsecure/bottle/v1/bottle.proto";
import "splitsecure/issuance/v1/attested.proto";
import "splitsecure/vaulttypes/v1/node_access.proto";

// GetRecord returns a record's stored Attested envelope: the signed issuance
// bytes, the team signatures and the attestation material. The client can
// use it to re-verify the record against the current team base identity.
// The record facts in listings cannot be verified.
//
// GetRecord never returns secret material. Record content is released only
// through VaultUse. NotFound works as in ListNodes.
message GetRecordRequest {
  splitsecure.bottle.v1.Bottle envelope = 1;
  Base base = 2;

  message Base {
    string vault_id = 1;

    string node_id = 2;

    // 0 means the latest revision. Revisions start at 1. Threshold vaults
    // serve only the latest and reject any other value with
    // InvalidArgument.
    uint32 revision = 3;
  }
}

message GetRecordResponse {
  // Verify the team signatures over Attested.issuance exactly as received.
  // Those bytes are never re-encoded.
  splitsecure.issuance.v1.Attested attested = 1;

  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;

  // The revision served. Threshold vaults always serve the latest. A record
  // created before revisions were numbered reports 0.
  uint32 revision = 4;

  splitsecure.vaulttypes.v1.NodeAccess access = 5;
}
