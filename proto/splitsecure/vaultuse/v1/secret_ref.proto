syntax = "proto3";
package splitsecure.vaultuse.v1;

message SecretRef {
  // The record id, scoped to the request's vault_id. On cluster-facing lanes
  // it is the <resource> segment of the record's s2r, never a full s2r.
  string id = 1;

  // 0 means the latest revision. Revisions start at 1. Threshold vaults
  // serve only the latest and reject any other value with InvalidArgument.
  // On a ReleaseResult it is the revision actually used. A record created
  // before revisions were numbered reports 0.
  uint32 revision = 2;
}
