syntax = "proto3";
package splitsecure.conveniencestore.v1;

import "splitsecure/enclave/v1/invoke_request.proto";

message GenerateCreateSAML2IdentityProviderProposalResponse {
  // invoke_request is the fully built payload the caller should pass to
