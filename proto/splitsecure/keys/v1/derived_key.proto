syntax = "proto3";
package splitsecure.keys.v1;

import "splitsecure/keys/v1/spec.proto";

message DerivedKey {
  // team_id can be repeated if this key depends on multiple teams.
  repeated bytes team_ids = 1;
  Spec spec = 2;
  bytes derivation = 3;
  // Version of the derivation construction. 0 is the legacy
  // construction. Consumers must reject an unknown version
  // instead of falling back to a default.
  uint32 derivation_version = 4;
}
