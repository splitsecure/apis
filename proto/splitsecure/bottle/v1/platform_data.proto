syntax = "proto3";
package splitsecure.bottle.v1;

import "splitsecure/bottle/v1/device_info.proto";

message PlatformData {
  // source is the identifier of the service that sealed this bottle.
  string source = 1;

  // device_info is self-reported by the device platform at sealing time.
  // Values are bound to the signing key by the bottle signature but are
  // NOT attested by the platform vendor (Apple DeviceCheck does not surface
  // model or app version).
  DeviceInfo device_info = 2;

  // principal_s2r is the s2r URI of the principal (service account, user,
  // or enclave) that created the enclave which sealed this bottle. Stamped
  // at enclave-creation time and sealed into every bottle the enclave
  // produces; tamper-evident via the bottle signature. Consumers dispatch
  // on s2rid.KindOf(principal_s2r) to resolve the principal.
  string principal_s2r = 3;
}
