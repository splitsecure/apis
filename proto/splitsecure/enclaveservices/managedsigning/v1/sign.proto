syntax = "proto3";
package splitsecure.enclaveservices.managedsigning.v1;

import "splitsecure/enclaveservices/managedsigning/v1/authenticated_signing_keys.proto";
import "splitsecure/hybridkeyset/v1/hybrid_key_set_with_detached_keys.proto";
import "splitsecure/hybridkeyset/v1/signature.proto";
import "splitsecure/keys/v1/serialized_key.proto";
import "splitsecure/keys/v1/spec.proto";

enum SignMode {
  SIGN_MODE_UNSPECIFIED = 0;
  // Independent signing. Each key signs independently.
  SIGN_MODE_INDEPENDENT = 1;
  // Combined signing. All keys sign together with bitfield binding.
  SIGN_MODE_HYBRID = 2;
}

message SignRequest {
  ManagedSigningKeysAuthenticated authenticated_signing_keys = 1;
  bytes data = 2;
  SignMode mode = 3;
}

message SignResponse {
  repeated SignResult results = 1;
}

message SignResult {
  oneof result {
    IndependentSignResult independent = 1;
    HybridSignResult hybrid = 2;
  }
}

message IndependentSignResult {
  bytes signature = 1;
  splitsecure.keys.v1.SerializedKey public_key = 2;
  splitsecure.keys.v1.Spec spec = 3;
}

message HybridSignResult {
  splitsecure.hybridkeyset.v1.Signature signature = 1;
  splitsecure.hybridkeyset.v1.HybridKeySetWithDetachedKeys hybrid_key_set = 2;
}
