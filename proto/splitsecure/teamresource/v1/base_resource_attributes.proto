syntax = "proto3";
package splitsecure.teamresource.v1;

import "splitsecure/teamresource/v1/account_sensitivity.proto";
import "splitsecure/teamresource/v1/notification_policy.proto";

// BaseResourceAttributes holds the common metadata shared by all managed resources.
message BaseResourceAttributes {
  string name = 1;
  string description = 2;
  splitsecure.teamresource.v1.NotificationPolicy notification_policy = 3;
  AccountSensitivity sensitivity = 4;
  bytes proposal_id = 5;

  // requested_parent_node_id is the vault-tree node the creator asked to file
  // this resource under. It rides in the quorum-signed part of a create
  // request so approvers and the audit trail see the creator's own placement
  // statement; empty requests the root of the resource's vault, which is also
  // the persist-time fallback when the requested parent no longer exists.
  // This is a birth-time request, not a live pointer: the node can be moved
  // afterwards without a new ceremony, and nothing keeps this field in sync
  // with the tree.
  string requested_parent_node_id = 6;

  // lineage_id identifies this resource's lineage across supersession
  // (HashiCorp-style versioning): every edit is a new CREATE presenting its
  // predecessor, and all versions of the "same" resource share one lineage.
  // Empty at genesis — the enclave stamps this into the signed bytes only
  // when a presented predecessor makes this a superseding CREATE, copying
  // the predecessor's lineage_id verbatim. A record's true lineage id is
  // therefore this field when non-empty, else the domain-tagged digest of
  // its own signed issuance bytes (genesis IS its own lineage). Callers
  // never set this directly; it is enclave-derived only.
  bytes lineage_id = 7;

  // revision counts supersessions within a lineage: 0 at genesis, and the
  // enclave stamps predecessor.revision + 1 into the signed bytes of each
  // superseding CREATE. Callers never set this directly.
  uint64 revision = 8;
}
