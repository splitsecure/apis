syntax = "proto3";

package splitsecure.orgsvc.v1;

import "splitsecure/orgsvc/v1/group.proto";
import "splitsecure/page/v1/page_params.proto";

message ListGroupsRequest {
  string org_s2r = 1;
  splitsecure.page.v1.PageParams page = 2;
}

message ListGroupsResponse {
  repeated Group groups = 1;
  bytes next_cursor = 2;
}
