syntax = "proto3";
package splitsecure.vaultbrowse.v1;

import "splitsecure/vaultbrowse/v1/create_folder.proto";
import "splitsecure/vaultbrowse/v1/describe_vault.proto";
import "splitsecure/vaultbrowse/v1/get_record.proto";
import "splitsecure/vaultbrowse/v1/list_nodes.proto";

// VaultBrowseService browses one vault: its tree and record metadata.
// Threshold vaults serve it through the coordination server. Online vaults
// serve it directly. Every request names its vault by vault_id. Nothing
// here is org-scoped.
//
// Navigation grants gate every read here. Only release policy gates secret
// values. No tier gives access to secret material, and this service never
// returns it. A node that does not exist and a node the caller may not see
// return the same NotFound.
//
// Machine callers authenticate each request with envelope. This is a bottle
// sealed by the caller, whose Authenticated.data is the request's Base. The
// server verifies it against the ecosystem root and accepts it only for a
// short time after PlatformData.sealed_at. People and workloads use session
// tokens in request headers and leave envelope unset.
service VaultBrowseService {
  rpc DescribeVault(DescribeVaultRequest) returns (DescribeVaultResponse);

  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);

  rpc GetRecord(GetRecordRequest) returns (GetRecordResponse);

  rpc CreateFolder(CreateFolderRequest) returns (CreateFolderResponse);
}
