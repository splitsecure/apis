syntax = "proto3";

package splitsecure.orgsvc.v1;

import "splitsecure/orgsvc/v1/service_account.proto";

// GetServiceAccounts resolves a batch of service-account S2R URIs against
// the caller's org. Same-org only. URIs that do not resolve to an SA in
// the caller's org are omitted from the response — the "unknown" signal
// for display fallback to the raw URI.
message GetServiceAccountsRequest {
  Base base = 2;
  message Base {
    string organization_id = 1; // caller's org
    repeated string service_account_ids = 2; // S2R sa: URIs to resolve
  }
}

message GetServiceAccountsResponse {
  repeated ServiceAccount service_accounts = 1;
}
