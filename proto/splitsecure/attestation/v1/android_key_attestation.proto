syntax = "proto3";
package splitsecure.attestation.v1;

// AndroidKeyAttestation contains Android Key Attestation certificate chain data.
// The leaf certificate contains an extension (OID 1.3.6.1.4.1.11129.2.1.17) with
// attestation data proving the key was generated on genuine Android hardware.
message AndroidKeyAttestation {
  // DER-encoded X.509 certificate chain from the Android device.
  repeated bytes certificate_chain = 1;
}
