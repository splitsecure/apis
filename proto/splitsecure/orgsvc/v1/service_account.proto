syntax = "proto3";

package splitsecure.orgsvc.v1;

import "google/protobuf/timestamp.proto";

// ServiceAccount is an org-scoped non-interactive principal. It is
// addressed by an S2R URI (s2r:{deployment}:sa:{id}) and is always a
// member of the org it belongs to.
message ServiceAccount {
  // S2R URI: s2r:{deployment}:sa:{id}.
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  string email = 4;
}
