syntax = "proto3";

package splitsecure.orgsvc.v1;

// DeactivationReason is why an organization left STATE_ACTIVE.
enum DeactivationReason {
  DEACTIVATION_REASON_UNSPECIFIED = 0;
  // STATE_BAD_STANDING, then STATE_PENDING_DELETION once suspended. Resolved
  // by fixing the payment or resubscribing.
  DEACTIVATION_REASON_LATE_PAYMENT = 1;
  // STATE_PENDING_DELETION: resolved by resubscribing.
  DEACTIVATION_REASON_CONTRACT_ENDED = 2;
  // STATE_PENDING_DELETION, scheduled by SplitSecure.
  DEACTIVATION_REASON_ADMIN_SCHEDULED = 3;
  // STATE_PENDING_DELETION, requested by an owner.
  DEACTIVATION_REASON_OWNER_REQUESTED = 4;
  // STATE_DEACTIVATED: a hold set by SplitSecure, never deleted automatically.
  DEACTIVATION_REASON_MANUAL = 5;
  // STATE_DEACTIVATED after a payment dispute.
  DEACTIVATION_REASON_PAYMENT_DISPUTED = 6;
  // STATE_DEACTIVATED before reasons were recorded.
  DEACTIVATION_REASON_LEGACY = 7;
  // The terms were breached, for example by holding several free
  // organizations. STATE_DEACTIVATED for the organizations SplitSecure
  // suspends outright. For the one it keeps: STATE_BAD_STANDING, then
  // STATE_PENDING_DELETION once suspended, resolved by upgrading to a paid
  // tier.
  DEACTIVATION_REASON_BREACH_OF_CONTRACT = 8;
}
