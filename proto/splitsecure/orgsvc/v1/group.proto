syntax = "proto3";

package splitsecure.orgsvc.v1;

import "google/protobuf/timestamp.proto";
import "splitsecure/orgsvc/v1/group_source.proto";

// Group is a named set of principals within an org.
message Group {
  string group_s2r = 1;
  string name = 2;
  GroupSource source = 3;
  // SCIM external id; empty for locally-managed groups.
  string external_id = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}
