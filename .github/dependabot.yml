version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /sdk/go
      - /examples/go
    schedule:
      interval: weekly
    cooldown:
      default-days: 10
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      go-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      go-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directories:
      - /
      - /sdk/es
      - /examples/es
    schedule:
      interval: weekly
    cooldown:
      default-days: 10
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      npm-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 10
    groups:
      actions-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
