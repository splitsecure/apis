syntax = "proto3";
package splitsecure.secrets.v1;

// SecretUseCase names the well-known metadata and data keys of a generic
// secret, and the one data key it requires. A required key holds a
// non-empty string. Any other metadata key is a cleartext field. Any other
// data key is a hidden field.
enum SecretUseCase {
  SECRET_USE_CASE_UNSPECIFIED = 0;

  // Requires no key.
  SECRET_USE_CASE_KEY_VALUE = 1;

  // Requires data key "password". Metadata keys are "username", "notes" and
  // the sites "url.1", "url.2" and so on. A site can have a "url.<n>.match"
  // of "domain", "host" or "never". The default is "domain".
  SECRET_USE_CASE_PASSWORD = 2;

  // Requires data key "note".
  SECRET_USE_CASE_NOTE = 3;

  // Requires data key "credential". Metadata keys are "system", "host",
  // "port", "username", "auth_method" and "notes". "system" is "server",
  // "database", "email", "api" or "other".
  SECRET_USE_CASE_ACCOUNT = 4;
}
