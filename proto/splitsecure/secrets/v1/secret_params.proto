syntax = "proto3";
package splitsecure.secrets.v1;

import "splitsecure/secrets/v1/secret_use_case.proto";

// SecretParams are the cleartext params of a generic-secret record. A secret
// has the shape of a HashiCorp Vault KV-v2 secret. These params are its
// custom_metadata. The sealed value is its data, a JSON object. The use case
// names the well-known keys of both. An update cannot change the use case.
message SecretParams {
  SecretUseCase use_case = 1;

  // Cleartext keys. Listings, search and autofill read them before any
  // release.
  map<string, string> metadata = 2;
}
